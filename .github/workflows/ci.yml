name: Continuous Integration
on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout SWTChart
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'

    - name: Build with Maven on X Window Virtual Framebuffer
      run: xvfb-run --auto-servernum mvn -Pjavadoc --T 1C verify -Dtycho.buildqualifier.format=yyyyMMddHHmm -Dproject.build.outputTimestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) --B -ntp -Dstyle.color=always -Dmaven.test.failure.ignore=true

    - name: Deploy update-site to the repository Github Page
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./org.eclipse.swtchart.updatesite/target/repository
